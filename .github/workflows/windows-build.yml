name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Build type
        required: true
        default: club-test
        type: choice
        options:
          - club-test
          - release-candidate
          - production
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GAME_PASSPORT_BUILD: ${{ github.sha }}
      GAME_PASSPORT_CLUB_TEST_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'club-test' }}
      GAME_PASSPORT_LICENSE_PUBLIC_KEY_SPKI_B64: ${{ secrets.GAME_PASSPORT_LICENSE_PUBLIC_KEY_SPKI_B64 }}
      GAME_PASSPORT_LICENSE_SIGNING_KEY_ID: ${{ secrets.GAME_PASSPORT_LICENSE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged Game Passport update
        shell: pwsh
        run: |
          if (Test-Path "game-passport-update.patch") {
            git apply --whitespace=nowarn "game-passport-update.patch"
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Validate production cloud, licensing and code-signing configuration
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY) -or
              $env:VITE_SUPABASE_URL.Contains("YOUR_PROJECT") -or
              $env:VITE_SUPABASE_ANON_KEY.Contains("YOUR_PUBLIC_ANON_KEY")) {
            throw "Production build stopped: add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as GitHub Actions repository secrets."
          }
          if ($env:GAME_PASSPORT_CLUB_TEST_BUILD -ne "true") {
            if ([string]::IsNullOrWhiteSpace($env:GAME_PASSPORT_LICENSE_PUBLIC_KEY_SPKI_B64) -or
                [string]::IsNullOrWhiteSpace($env:GAME_PASSPORT_LICENSE_SIGNING_KEY_ID)) {
              throw "Production build stopped: add the pinned license public key and signing key id."
            }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
                [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw "Production build stopped: add the Windows Authenticode PFX and password."
            }
          }
      - name: Frontend adapter and Supabase payload tests
        run: pnpm test
      - name: TypeScript and production frontend build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_FIELD_TEST_MODE: "false"
          VITE_CLUB_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'club-test' }}
        run: pnpm build
      - name: Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Windows Rust, NVAPI bridge and adapter tests (CS2, Display, NVIDIA, Mouse, PUBG)
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Import Authenticode certificate and configure Tauri signing
        if: env.GAME_PASSPORT_CLUB_TEST_BUILD != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "game-passport-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate) { throw "Could not import the Authenticode certificate." }
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content "src-tauri/tauri.conf.json" -Encoding utf8
          "GAME_PASSPORT_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build real MSI and NSIS installers
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_FIELD_TEST_MODE: "false"
          VITE_CLUB_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'club-test' }}
        with:
          args: --target x86_64-pc-windows-msvc
      - name: Verify Authenticode signatures
        if: env.GAME_PASSPORT_CLUB_TEST_BUILD != 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found." }
          $signedFiles = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/game-passport.exe") + @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe") + @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi")
          foreach ($signedFile in $signedFiles) {
            & $signTool.FullName verify /pa /all $signedFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($signedFile.Name)." }
          }
          Remove-Item $env:GAME_PASSPORT_CERTIFICATE_PATH -Force
      - name: Verify and stage Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"
          $msi = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi"
          if ($nsis.Count -lt 1 -or $msi.Count -lt 1) { throw "Both NSIS and MSI installers are required." }
          New-Item -ItemType Directory -Force "windows-artifacts" | Out-Null
          $installerFiles = @($nsis.FullName) + @($msi.FullName)
          Copy-Item -Path $installerFiles -Destination "windows-artifacts"
          Get-ChildItem "windows-artifacts" -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "windows-artifacts/SHA256SUMS.txt"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: game-passport-windows-${{ inputs.release_type || github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: windows-artifacts/*
      - name: Publish licensed release-candidate installers
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release-candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "licensed-rc-${{ github.run_number }}" "windows-artifacts/*" `
            --title "Game Passport v0.8.0 RC — Защищённый Apply #${{ github.run_number }}" `
            --notes "Облачная Windows-сборка с Apply Lock Mode, аварийным rollback/recovery, понятным подтверждением email, восстановлением пароля и onboarding. Установщики подписаны Authenticode; SHA-256 приложены." `
            --prerelease
      - name: Publish unsigned club-test installer
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'club-test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "club-test-${{ github.run_number }}" "windows-artifacts/*" `
            --title "Game Passport v0.8.0 — Club Test #${{ github.run_number }}" `
            --notes "Тестовая Windows-сборка для проверки в компьютерном клубе. Облачные профили и реальные адаптеры CS2, Steam, NVIDIA, дисплея, мыши и PUBG включены. Коммерческая активация компьютеров временно отключена только в этой сборке. Установщик не подписан платным Authenticode-сертификатом, поэтому Windows покажет предупреждение «Неизвестный издатель». SHA-256 приложены." `
            --prerelease
      - name: Publish production installers
        if: (github.event_name == 'workflow_dispatch' && inputs.release_type == 'production') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v0.8.0" }
          gh release create $releaseTag "windows-artifacts/*" `
            --title "Game Passport v0.8.0 — Production #${{ github.run_number }}" `
            --notes "Production Windows-сборка с Apply Lock Mode, crash recovery, email confirmation, password recovery и onboarding. Установщики подписаны Authenticode; SHA-256 приложены." `
            --latest
