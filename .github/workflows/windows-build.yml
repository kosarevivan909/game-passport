name: Windows build

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GAME_PASSPORT_BUILD: ${{ github.sha }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_DEMO_MODE: "false"
      VITE_FIELD_TEST_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged source update when building a web-uploaded release branch
        shell: pwsh
        run: |
          if (-not (Test-Path "src/domain/accessPolicy.json")) {
            $patchParts = Get-ChildItem "fastplay-v0.11.0.patch.part-*" | Sort-Object Name
            if ($patchParts.Count -eq 0) { throw "FastPlay release source is missing." }
            Get-Content $patchParts.FullName -AsByteStream | Set-Content "fastplay-v0.11.0.patch" -AsByteStream
            git apply --check --whitespace=nowarn "fastplay-v0.11.0.patch"
            if ($LASTEXITCODE -ne 0) { throw "Release patch validation failed." }
            git apply --whitespace=nowarn "fastplay-v0.11.0.patch"
            if ($LASTEXITCODE -ne 0) { throw "Release patch application failed." }
          }
      - name: Validate public cloud distribution
        shell: pwsh
        run: |
          $policy = Get-Content "src/domain/accessPolicy.json" -Raw | ConvertFrom-Json
          if ($policy.deviceActivationRequired -isnot [bool] -or $policy.deviceActivationRequired) {
            throw "Public installer must not require per-PC activation."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY) -or
              $env:VITE_SUPABASE_URL.Contains("YOUR_PROJECT") -or
              $env:VITE_SUPABASE_ANON_KEY.Contains("YOUR_PUBLIC_ANON_KEY")) {
            throw "Add real VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets."
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Public sign-in, cloud profiles and adapter tests
        run: pnpm test
      - name: TypeScript and production frontend build
        run: pnpm build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Windows tests including the real public access guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Build real MSI and NSIS installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target x86_64-pc-windows-msvc
      - name: Verify and stage Windows installers
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe")
          $msi = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi")
          if ($nsis.Count -lt 1 -or $msi.Count -lt 1) { throw "Both NSIS and MSI installers are required." }
          New-Item -ItemType Directory -Force "windows-artifacts" | Out-Null
          $installerFiles = @($nsis.FullName) + @($msi.FullName)
          Copy-Item -Path $installerFiles -Destination "windows-artifacts"
          Get-ChildItem "windows-artifacts" -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "windows-artifacts/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fastplay-windows-public-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: windows-artifacts/*
      - name: Publish public installer from this exact source commit
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $releaseTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "public-${{ github.run_number }}" }
          gh release create $releaseTag "windows-artifacts/*" --target "${{ github.sha }}" `
            --title "FastPlay v$version — CS2, PUBG и VALORANT" `
            --notes "FastPlay 0.11.0 — новая общедоступная версия приложения. Название, интерфейс и иконка обновлены. CS2 сохранена без изменения рабочего потока. PUBG подключена в основной интерфейс. Добавлен безопасный адаптер VALORANT: поиск актуального локального профиля, перенос GameUserSettings.ini и RiotUserSettings.ini, блокировка при запущенной игре, резервная копия, повторная проверка и автоматический откат. Riot-логины, токены, Vanguard и аппаратные идентификаторы не читаются и не сохраняются. Экран, игровые настройки и NVIDIA остаются независимыми. Установщики не подписаны Authenticode; сначала проверьте на одном Windows-ПК. SHA-256 приложены." `
            --prerelease
